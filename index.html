    <!-- Applies a saved theme before the page paints, so a dark-mode visitor never sees a light flash. -->
    <script>
      try {
        var t = localStorage.getItem('theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
